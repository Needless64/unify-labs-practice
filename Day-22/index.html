<!doctype html>
<html>
  <head>
    <title>Crypto Watchlist</title>
    <style>
      body {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        font-family: Arial;
      }
      .left {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      img {
        width: 700px;
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <button id="themeToggle">Toggle Theme</button>
      <input id="search" placeholder="Search coin" />
      <select id="sort">
        <option value="name">Name</option>
        <option value="price">Price</option>
      </select>
      <div id="loader">Loading...</div>
      <div id="list"></div>
    </div>

    <img src="https://i.ibb.co/KjJ9KXyC/image.png" alt="rich$" />

    <script type="module" src="./App.js"></script>
  </body>
</html>
